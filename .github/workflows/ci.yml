name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend – build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore SweetMart.sln
      - name: Build
        run: dotnet build SweetMart.sln -c Release --no-restore
      - name: Test (xUnit + SQLite in-memory)
        run: dotnet test SweetMart.sln -c Release --no-build --logger "trx;LogFileName=ket-qua.trx"
      - name: Lưu kết quả test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-test
          path: '**/TestResults/*.trx'

  frontend:
    name: Frontend – lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker – build image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Build image Backend
        run: docker build -t sweetmart-api ./backend/SweetMart.Api
      - name: Build image Frontend
        run: docker build -t sweetmart-web ./frontend
