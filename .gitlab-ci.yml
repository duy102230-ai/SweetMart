# Pipeline CI của SweetMart trên GitLab
# Chạy khi push lên main, develop, feature/** và khi mở Merge Request.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feature\//

stages:
  - test
  - docker

backend:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
  cache:
    key: nuget
    paths: [.nuget/]
  script:
    - dotnet restore SweetMart.sln
    - dotnet build SweetMart.sln -c Release --no-restore
    - dotnet test SweetMart.sln -c Release --no-build --logger "trx;LogFileName=ket-qua.trx"
  artifacts:
    when: always
    name: ket-qua-test
    paths:
      - "**/TestResults/*.trx"
    expire_in: 30 days

frontend:
  stage: test
  image: node:22
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm/]
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
    - npm run build

docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
  script:
    - docker build -t sweetmart-api ./backend/SweetMart.Api
    - docker build -t sweetmart-web ./frontend
